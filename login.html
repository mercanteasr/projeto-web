<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Corrilet</title>
    <link rel="stylesheet" href="elements.css">
</head>
<body>
    <!--cabeçalho-->
    <header>
        <a href="index.html" class="logo">
            <span class="logo-icon">
                <span class="montanha"></span>
            </span>
            <h1>Corrilet</h1>
        </a>
        <nav>
            <a href="index.html#produtos">Produtos</a>
            <a href="index.html#contatos">Contatos</a>
            <a href="index.html#produtos">Categorias</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <main class="admin">
        <h2>Entrar</h2>

        <!--formulário de login-->
        <form class="form-admin form-login">
            <label for="email-pagina-login">E-mail</label>
            <input type="email" id="email-pagina-login" required>

            <label for="senha-pagina-login">Senha</label>
            <input type="password" id="senha-pagina-login" required>

            <button type="submit" class="btn-entrar">Entrar</button>
        </form>

        <p class="link-conta">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </main>

    <!-- Rodapé -->
    <footer id="contatos">
        <p>Corrilet moda Masculina 2026 - Corriletfashion67@gmail.com - (00) 00000-0000</p>
        <p>Vista quem você é. Corrilet.</p>
    </footer>

    <script src="global.js"></script>
</body>
</html>
